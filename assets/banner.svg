<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="orbGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="orbGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#475569" fill-opacity="0.5" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .flow-line {
        stroke-dasharray: 8, 8;
        animation: dash 25s linear infinite;
      }
      .flow-pulse {
        animation: pulse 3s ease-in-out infinite alternate;
      }
      .node-pulse {
        animation: floatNode 4s ease-in-out infinite alternate;
      }
      .node-pulse-2 {
        animation: floatNode 4s ease-in-out infinite alternate-reverse;
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -1000;
        }
      }
      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.98); }
        100% { opacity: 0.8; transform: scale(1.02); }
      }
      @keyframes floatNode {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-5px); }
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Dynamic Glowing Background Orbs -->
  <circle cx="200" cy="120" r="220" fill="url(#orbGrad1)" filter="url(#glow)" />
  <circle cx="1020" cy="300" r="240" fill="url(#orbGrad2)" filter="url(#glow)" />

  <!-- Animated BPMN Process Flow Lines in Background -->
  <g opacity="0.6">
    <path class="flow-line" d="M 80,330 C 260,330 320,380 500,380 C 680,380 740,320 920,320 C 1040,320 1100,350 1140,350" fill="none" stroke="#6366f1" stroke-width="2.5" />
    <path class="flow-line" d="M 60,90 C 220,90 300,50 480,50 C 660,50 720,110 900,110 C 1020,110 1100,70 1160,70" fill="none" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- Decorative Process Diagram Nodes in Background/Edges -->
  <g class="node-pulse" transform="translate(60, 290)">
    <rect width="130" height="44" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8" />
    <text x="65" y="27" fill="#94a3b8" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="middle">⚙️ Start Event</text>
  </g>

  <g class="node-pulse-2" transform="translate(1010, 70)">
    <rect width="140" height="44" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.8" />
    <text x="70" y="27" fill="#94a3b8" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="middle">⚡ Process Engine</text>
  </g>

  <!-- Central Foreground Content: Guaranteed Safe from Overlap -->
  <!-- Top Category Badge Pill -->
  <g transform="translate(600, 85)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
    <circle cx="-115" cy="0" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="10" y="5" fill="#cbd5e1" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="middle" letter-spacing="1">CURATED ENTERPRISE &amp; OSS BPM</text>
  </g>

  <!-- Main Title -->
  <text class="title-text" x="600" y="165" font-size="44" fill="#ffffff" text-anchor="middle">
    Business Process Management
  </text>
  <text class="title-text" x="600" y="215" font-size="34" fill="url(#accentGrad)" text-anchor="middle">
    Awesome BPM &amp; Workflow Orchestration
  </text>

  <!-- Subtitle / Tagline -->
  <text class="sub-text" x="600" y="265" font-size="16" fill="#94a3b8" text-anchor="middle">
    Enterprise SaaS Platforms • Open-Source BPMN Engines • Low-Code Orchestration
  </text>

  <!-- Feature Metric Pills at Bottom -->
  <g transform="translate(600, 335)">
    <!-- Pill 1: BPMN 2.0 -->
    <g transform="translate(-320, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" fill="#38bdf8" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="middle">📐 BPMN 2.0 &amp; DMN</text>
    </g>

    <!-- Pill 2: SaaS & OSS -->
    <g transform="translate(-110, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" fill="#a78bfa" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="middle">☁️ SaaS &amp; Open Source</text>
    </g>

    <!-- Pill 3: Agentic Workflows -->
    <g transform="translate(100, 0)">
      <rect x="-95" y="-16" width="190" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" fill="#34d399" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="middle">🤖 AI Agentic Workflows</text>
    </g>

    <!-- Pill 4: Microservices -->
    <g transform="translate(310, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" fill="#f472b6" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="middle">⚡ Microservices</text>
    </g>
  </g>
</svg>
